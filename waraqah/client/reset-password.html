<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة السر - مجلة ورقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-body min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm rounded-xl p-6 shadow-xl space-y-4">
        <div class="text-center">
            <h1 class="font-logo text-4xl font-bold text-amber-500 leading-none">ورقة</h1>
            <p class="text-xs text-slate-400 mt-1">إعادة تعيين كلمة السر</p>
        </div>

        <form id="reset-form" class="space-y-3 text-sm">
            <input type="password" id="new-password" placeholder="كلمة السر الجديدة (6 أحرف على الأقل)" required class="w-full p-2.5 border rounded outline-none focus:ring-1 focus:ring-amber-500">
            <input type="password" id="confirm-password" placeholder="تأكيد كلمة السر الجديدة" required class="w-full p-2.5 border rounded outline-none focus:ring-1 focus:ring-amber-500">
            <p id="reset-error" class="hidden text-red-600 text-xs font-semibold"></p>
            <p id="reset-success" class="hidden text-green-700 text-xs font-semibold"></p>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded transition">حفظ كلمة السر الجديدة</button>
        </form>

        <div class="text-center pt-2 border-t">
            <a href="index.html" class="text-[11px] text-amber-700 hover:underline">الرجوع للصفحة الرئيسية</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        document.getElementById('reset-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const newPassword = document.getElementById('new-password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();
            const errorEl = document.getElementById('reset-error');
            const successEl = document.getElementById('reset-success');
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            if (!token) {
                errorEl.innerText = 'رابط إعادة التعيين غير صالح. تأكد إنك فتحت الرابط اللي وصلك في الإيميل كامل.';
                errorEl.classList.remove('hidden');
                return;
            }
            if (newPassword.length < 6) {
                errorEl.innerText = 'كلمة السر يجب أن تكون 6 أحرف على الأقل.';
                errorEl.classList.remove('hidden');
                return;
            }
            if (newPassword !== confirmPassword) {
                errorEl.innerText = 'كلمة السر وتأكيدها غير متطابقين.';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/readers/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'حدث خطأ.');

                successEl.innerText = data.message;
                successEl.classList.remove('hidden');
                document.getElementById('reset-form').reset();
                document.getElementById('reset-form').classList.add('hidden');
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
